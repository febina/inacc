<script>
const DATA = {"modules": [{"title": "Recruitment foundations", "goal": "Understand the hiring ecosystem and the recruiter’s role.", "lessons": [{"title": "What recruitment means", "content": "<p>Recruitment is a service process that connects a defined business need with a person who can perform the work. The recruiter is accountable for understanding the requirement, finding relevant people, checking evidence, communicating accurately and keeping the process moving.<\/p>\n<p><strong>How to apply “What recruitment means”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <em>your interpretation<\/em> in your notes. This simple discipline makes handovers more useful and reduces rework.<\/p>\n<p><strong>Worked recruitment example:<\/strong> A client requests a senior backend engineer for a remote contract. Do not search only for the exact title. Translate the requirement into outcomes and evidence: backend service ownership, relevant language/framework, API design, database experience, production support, senior-level decision making, time-zone overlap, availability and approved rate. A profile with matching keywords but no project ownership is not yet a qualified match.<\/p>\n<p><strong>Practical method:<\/strong> (1) Read the requirement or candidate evidence once for context. (2) Extract the specific facts relevant to the topic. (3) Verify dates, scope, tools and constraints. (4) Record unanswered questions. (5) Ask neutral follow-up questions. (6) Make a recommendation with a short rationale. (7) Update the recruitment record on the same day.<\/p>\n<p><strong>Common mistakes:<\/strong> relying on job titles alone; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisation; quoting an unapproved rate; and failing to record why a decision was made. Avoid these by using a checklist and evidence-based notes.<\/p>\n<p><strong>Professional standard:<\/strong> Be fast without becoming careless. Tell candidates what is known, what is still being confirmed and when they can expect an update. If the facts conflict or a mandatory condition is unclear, pause and escalate rather than forcing a submission.<\/p>\n<div class=\"callout\"><b>Knowledge check<\/b><br>Can you explain the concept in your own words, identify the evidence needed, and describe one risk if it is handled incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “What recruitment means”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-check:<\/b> If your conclusion depends on an assumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}, {"title": "Recruitment vs talent acquisition", "content": "<p>Recruitment is a service process that connects a defined business need with a person who can perform the work. The recruiter is accountable for understanding the requirement, finding relevant people, checking evidence, communicating accurately and keeping the process moving.<\/p>\n<p><strong>How to apply “Recruitment vs talent acquisition”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <e omes and evidence: backend service ownership, relevant language/framework, API design, database experience, production support, senior-level decision making, time-zone overlap, availability and approved rate. A profile with matching keywords but no project ownership is not yet a qualified match.<\/p>\n<p><strong>Practical method:<\/strong> (1) Read the requirement or candidate evidence once for context. (2) Extract the specific facts relevant to the topic. (3) Verify dates, scope, tools and constraints. (4) Record unanswered questions. (5) Ask neutral follow-up questions. (6) Make a recommendation with a short rationale. (7) Update the recruitment record on the same day.<\/p>\n<p><strong>Common mistakes:<\/strong> relying on job titles alone; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisation; quoting an unapproved rate; and failing to record why a decision was made. Avoid these by using a checklist and evidence-based notes.<\/p>\n<p><strong>Professional standard:<\/strong> Be fast without becoming careless. Tell candidates what is known, what is still being confirmed and when they can expect an update. If the facts conflict or a mandatory condition is unclear, pause and escalate rather than forcing a submission.<\/p>\n<div class=\"callout\"><b>Knowledge check<\/b><br>Can you explain the concept in your own words, identify the evidence needed, and describe one risk if it is handled incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “The recruitment lifecycle”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-chec s relevant to the topic. (3) Verify dates, scope, tools and constraints. (4) Record unanswered questions. (5) Ask neutral follow-up questions. (6) Make a recommendation with a short rationale. (7) Update the recruitment record on the same day.<\/p>\n<p><strong>Common mistakes:<\/strong> relying on job titles alone; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisation; quoting an unapproved rate; and failing to record why a decision was made. Avoid these by using a checklist and evidence-based notes.<\/p>\n<p><strong>Professional standard:<\/strong> Be fast without becoming careless. Tell candidates what is known, what is still being confirmed and when they can expect an update. If the facts conflict or a mandatory condition is unclear, pause and escalate rather than forcing a submission.<\/p>\n<div class=\"callout\"><b>Knowledge check<\/b><br>Can you explain the concept in your own words, identify the evidence needed, and describe one risk if it is handled incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “Contract hiring lifecycle”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-check:<\/b> If your conclusion depends on an assumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}, {"title": "Interview and selection terminology", "content": "<p>Technology hiring is evidence-led. A candidate saying they know a tool is not the same as showing that they used it to deliver a production outcome. Ask what was built, what the person personally owned, which tools were used and what changed because of the work.<\/p>\n<p><strong>How to apply “Interview and selection terminology”:<\/strong> Begin by defining the decision you need to make. Identify the inf  incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “Sourcing fundamentals”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone o d unanswered questions. (5) Ask neutral follow-up questions. (6) Make a recommendation with a short rationale. (7) Update the recruitment record on the same day.<\/p>\n<p><strong>Common mistakes:<\/strong> relying on job titles alone; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisation; quoting an unapproved rate; and failing to record why a decision was made. Avoid these by using a checklist and evidence-based notes.<\/p>\n<p><strong>Professional standard:<\/strong> Be fast without becoming careless. Tell candidates what is known, what is still being confirmed and when they can expect an update. If the facts conflict or a mandatory condition is unclear, pause and escalate rather than forcing a submission.<\/p>\n<div class=\"callout\"><b>Knowledge check<\/b><br>Can you explain the concept in your own words, identify the evidence needed, and describe one risk if it is handled incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “International and contract talent sourcing”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3> e appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-check:<\/b> If your conclusion depends on an assumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}, {"title": "LinkedIn messages", "content": "<p>Candidate communication is part of the assessment experience. Messages should be specific, concise and truthful about employment type, work mode, duration, rate structure and next steps. Never create urgency or certainty that has not been authorised.<\/p>\n<p><strong>How to apply “LinkedIn messages”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <em>your interpretation<\/em> in your notes. This simple discipline makes handovers more useful and reduces rework.<\/p>\n<p><strong>Worked recruitment example:<\/strong> A client requests a senior backend engineer for a remote contract. Do not search only for the exact title. Translate the requirement into outcomes and evidence: backend service ownership, relevant language/framework, API design, database experience, production support, senior-level decision making, time-zone rce; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-check:<\/b> If your conclusion depends on an assumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}]}, {"title": "Candidate screening", "goal": "Conduct structured first-level screening without impersonating a technical interviewer.", "lessons": [{"title": "Prepare for the screening call", "content": "<p>Screening is a structured first-level quality gate, not a substitute for a technical interview. The recruiter validates claims, asks for concrete examples, checks logistics and records evidence for the hiring team.<\/p>\n<p><strong>How to apply “Prepare for the screening call”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <em>your interpretation<\/em> in your notes. This simple discipline makes handovers more useful and reduces rework.<\/p>\n<p><strong>Worked recruitment example:<\/strong> A client requests a senior backend engineer for a remote contract. Do not search only for the exact title. Translate the requirement into outcomes and evidence: backend service ownership, relevant language/framework, API design, database experience, production support, senior-level decision making, time-zone overlap, availability and approved rate. A profile with matching keywords but no project ownership is not yet a qualified match.<\/p>\n<p><strong>Practical method:<\/strong> (1) Read the requirement or candidate evidence once for context. (2) Extract the specific facts relevant to the topic. (3) Verify dates, scope, tools and constraints. (4) Record unanswered questions. (5) Ask neutral follow-up questions. (6) Make a recommendation with a short rationale. (7) Update the recruitment record on the same day.<\/p>\n<p><strong>Common mistakes:<\/strong> relying on job titles alone; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisation; quoting an unapproved rate; and faili s known, what is still being confirmed and when they can expect an update. If the facts conflict or a mandatory condition is unclear, pause and escalate rather than forcing a submission.<\/p>\n<div class=\"callout\"><b>Knowledge check<\/b><br>Can you explain the concept in your own words, identify the evidence needed, and describe one risk if it is handled incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “Availability, location and rate checks”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising sumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}, {"title": "Scheduling across time zones", "content": "<p>Interview coordination reduces friction and prevents avoidable no-shows. Confirm the time zone, participants, format, duration, meeting link and preparation expectations; then close the loop with feedback and next steps.<\/p>\n<p><strong>How to apply “Scheduling across time zones”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <em>your interpretation<\/em> in your notes. This simple discipline makes handovers more useful and reduces rework.<\/p>\n<p><strong>Worked recruitment example:<\/strong> A client requests a senior backend engineer for a remote contract. Do not search only for the exact title. Translate the requirement into outcomes and evidence: backend service ownership, relevant language/framework, API design, database experience, production support, senior-level decision making, time-zone overlap, availability and approved rate. A profile with matching keywords but no project ownership is not yet a qualified match.<\/p>\n<p><strong>Practical method:<\/strong> (1) Read the requirement or candidate evidence once for context. (2) Extract the specific facts relevant to the topic. (3) Verify dates, scope, tools and constraints. (4) Record unanswered questions. (5) Ask neutral follow-up questions. (6) Make a recommendation with a short rationale. (7) Update the recruitment record on the same day.<\/p>\n<p><strong>Common mistakes:<\/strong> relying on job titles alone; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisati selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-check:<\/b> If your conclusion depends on an assumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}, {"title": "Maintaining candidate engagement", "content": "<p>Interview coordination reduces friction and prevents avoidable no-shows. Confirm the time zone, participants, format, duration, meeting link and preparation expectations; then close the loop with feedback and next steps.<\/p>\n<p><strong>How to apply “Maintaining candidate engagement”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <em>your interpretation<\/em> in your notes. This simple discipline makes handovers more useful and reduces rework.<\/p>\n<p><strong>Worked recruitment example:<\/strong> A client requests a senior backend engineer for a remote contract. Do not search only for the exa  of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “Counter-offer risk management”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business problem, what part did you personally deliver, which version or services did you use, and how was the result tested or operated?” Record the candidate’s answer in neutral language. Do not upgrade the claim to “expert” unless the evidence supports that conclusion.<\/p>\n<p>When speaking with a candidate, use clear and non-leading questions. Avoid suggesting the answer, promising selection or disclosing information that has not been approved. When speaking with a client or internal stakeholder, summarise the evidence and the remaining risk in one concise paragraph. For example: “The profile appears aligned on the three core skills and has described production ownership. We still need to confirm the approved monthly rate and the required time-zone overlap before submission.”<\/p>\n<h3>Practice output<\/h3>\n<p>Complete a one-page work note for this lesson. Include: (1) a concise definition in your own words; (2) three facts a recruiter must verify; (3) two follow-up questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter one; treating “exposure” as hands-on expertise; confusing preferred skills with mandatory skills; assuming availability or work authorisation; quoting an unapproved rate; and failing to record why a decision was made. Avoid these by using a checklist and evidence-based notes.<\/p>\n<p><strong>Professional standard:<\/strong> Be fast without becoming careless. Tell candidates what is known, what is still being confirmed and when they can expect an update. If the facts conflict or a mandatory condition is unclear, pause and escalate rather than forcing a submission.<\/p>\n<div class=\"callout\"><b>Knowledge check<\/b><br>Can you explain the concept in your own words, identify the evidence needed, and describe one risk if it is handled incorrectly? Write a 3–5 sentence answer in your notes before moving on.<\/div>\n<h3>Decision framework for this lesson<\/h3>\n<p>Before acting, answer four questions in order: <b>What is the requirement?<\/b> State it in observable terms. <b>What evidence do I have?<\/b> Identify whether it comes from the client, candidate, resume, internal system or a verified document. <b>What remains unknown?<\/b> List missing facts instead of filling them with assumptions. <b>Who can authorise the next step?<\/b> Route exceptions to the Talent Manager, Team Lead, Operations or another authorised owner.<\/p>\n<p>For “Screening and submission conversion”, use a simple evidence record with these fields: requirement or claim; evidence observed; date/source; confidence level; follow-up question; decision; owner; next action and due date. This structure makes the record useful to another recruiter who takes over the role. It also prevents a statement such as “good candidate” from replacing a reasoned assessment.<\/p>\n<h3>Worked example and recruiter language<\/h3>\n<p>Imagine a candidate says, “I have worked with this technology for five years.” A useful follow-up is: “Could you walk me through one recent project where you used it? What was the business  questions; (4) one common failure mode; (5) the record or system that should be updated; and (6) the point at which you would stop and escalate. A strong answer is specific enough that another recruiter could repeat the process without asking you what you meant.<\/p>\n<p><b>Self-check:<\/b> If your conclusion depends on an assumption, label it. If a decision could affect pay, legal status, privacy, client confidentiality or a mandatory submission gate, do not improvise. Preserve the facts and ask the authorised owner.<\/p>\n"}, {"title": "Dual employment and conflict risks", "content": "<p>Ethical recruitment requires informed consent, accurate representation, confidentiality and consistent evaluation. When a question involves law, tax, immigration or policy interpretation, do not improvise: preserve the facts and escalate.<\/p>\n<p><strong>How to apply “Dual employment and conflict risks”:<\/strong> Begin by defining the decision you need to make. Identify the information that would support that decision, the source of each fact and the person authorised to confirm it. Separate <em>verified facts<\/em>, <em>candidate statements<\/em> and <em>your interpretation<\/em> in your notes. This simple discipline makes handovers more useful and reduces rework.<\/p>\n<p><strong>Worked recruitment example:<\/strong> A client requests a senior backend engineer for a remote contract. Do not search only for the exact title. Translate the requirement into outcomes and evidence: backend service ownership, relevant language/framework, API design, database experience, production support, senior-level decision making, time-zone overlap, availability and approved rate. A profile with matching keywords but no project ownership is not yet a qualified match.<\/p>\n<p><strong>Practical method:<\/strong> (1) Read the requirement or candidate evidence once for context. (2) Extract the specific facts relevant to the topic. (3) Verify dates, scope, tools and constraints. (4) Record unanswere const state=JSON.parse(localStorage.getItem('rbAcademy')||'{}');
state.done=state.done||{};state.passed=state.passed||{};state.attempts=state.attempts||{};state.assignments=state.assignments||{};state.scores=state.scores||{};
function save(){localStorage.setItem('rbAcademy',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(){let total=DATA.modules.reduce((a,m)=>a+m.lessons.length,0),done=Object.keys(state.done).filter(k=>state.done[k]).length;return Math.round(done/total*100)}
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({dashboard,path:dashboard,modules:modules,glossary:glossary,tech:tech,jd:jdLab,resume:resumeLab,boolean:booleanLab,sourcing:sourcingLab,competitor:competitorLab,communication:communicationLab,simulator:simulator,assignments:assignments,finalexam:finalExam,performance:performance,certificate:certificate}[v]||dashboard)()}

function path(){ $('#app').innerHTML=`<div class="eyebrow">CURRICULUM</div><h1>Modules</h1><p class="muted">Complete lessons, submit assignments and pass each module examination. The next module is available for study, while certification remains gated by all requirements.</p><div class="grid two">${DATA.modules.map(moduleCard).join('')}</div>`}
function modules(){path()}
function openModule(i){let m=DATA.modules[i];$('#app').innerHTML=`<div class="module-head"><div class="eyebrow" style="color:#ffe1e9">MODULE ${i+1} OF 16</div><h1>${esc(m.title)}</h1><p>${esc(m.goal)}</p><div class="pill" style="background:#ffffff30;color:white">${m.lessons.length} lessons · 3 assignments · 15-question exam</div></div><div class="grid two"><div class="card"><h3>Learning objectives</h3><ul><li>Explain the key concepts in plain language.</li><li>Apply a consistent, evidence-based recruitment process.</li><li>Identify risks and know when to escalate.</li><li>Record decisions clearly for the next stakeholder.</li></ul></div><div class="card"><h3>Module progress</h3><div class="stat">${m.lessons.filter((l,j)=>state.done[i+'-'+j]).length}/${m.lessons.length}</div><div class="progress"><i style="width:${m.lessons.filter((l,j)=>state.done[i+'-'+j]).length/m.lessons.length*100}%"></i></div><p class="small">Pass the module exam with at least 80%.</p><button class="btn" onclick="startQuiz(${i})">Take module examination</button></div></div><h2 style="margin-top:22px">Lessons</h2><div class="lessonlist">${m.lessons.map((l,j)=>`<button class="lesson ${state.done[i+'-'+j]?'done':''}" onclick="lesson(${i},${j})"><span><b>${j+1}. ${esc(l.title)}</b><br><span class="small">${state.done[i+'-'+j]?'Completed':'Study lesson'} · Open lesson</span></span><span>${state.done[i+'-'+j]?'✓':'→'}</span></button>`).join('')}</div><h2 style="margin-top:24px">Module assignments</h2><div class="grid">${[1,2,3].map(n=>`<div class="card"><span class="pill">ASSIGNMENT ${n}</span><h3>${['Knowledge application','Recruitment work sample','Decision and handover'][n-1]}</h3><p class="small">${['Explain the core workflow and create a checklist for this module.','Use a fictional JD and candidate profile to produce a documented recommendation.','Review a scenario, identify risks and prepare an escalation or next-step note.'][n-1]}</p><button class="btn secondary" onclick="assignment(${i},${n})">${state.assignments[i+'-'+n]?'Review submission':'Start assignment'}</button></div>`).join('')}</div>`}
function lesson(i,j){let m=DATA.modules[i],l=m.lessons[j];$('#app').innerHTML=`<div class="content"><div class="eyebrow">MODULE ${i+1} · LESSON ${j+1}</div><h1>${esc(l.title)}</h1><p class="muted">${esc(m.goal)}</p><div class="card">${l.content}</div><div class="card" style="margin-top:15px"><h3>Apply it</h3><p>Write one example from a real or simulated recruitment requirement. Identify the facts, the evidence source, the decision and any unresolved question.</p><textarea id="lessonNote" placeholder="Your notes / example...">${esc(state['note'+i+'-'+j]||'')}</textarea><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="saveNote(${i},${j})">Save notes</button><button class="btn" onclick="markDone(${i},${j})">${state.done[i+'-'+j]?'Completed ✓':'Mark lesson complete'}</button><button class="btn secondary" onclick="openModule(${i})">Back to module</button></div></div><div class="between" style="margin-top:18px"><button class="btn secondary" ${j===0?'disabled':''} onclick="lesson(${i},${j-1})">← Previous</button><button class="btn" ${j===m.lessons.length-1?'disabled':''} onclick="lesson(${i},${j+1})">Next lesson →</button></div></div>`}
function saveNote(i,j){state['note'+i+'-'+j]=$('#lessonNote').value;save();alert('Notes saved in this browser.')}
function markDone(i,j){state.done[i+'-'+j]=true;save();openModule(i)}
function assignment(i,n){let key=i+'-'+n;$('#app').innerHTML=`<div class="content"><div class="eyebrow">MODULE ${i+1} · ASSIGNMENT ${n}</div><h1>${['Knowledge application','Recruitment work sample','Decision and handover'][n-1]}</h1><div class="card"><h3>Scenario</h3><p>A client needs a remote senior engineer for a 6-month contract. The JD contains mandatory skills, preferred skills, a rate ceiling and a time-zone overlap. You have three profiles with different strengths and availability.</p><h3>Your task</h3><ol><li>Summarise the requirement and separate must-have from preferred criteria.</li><li>Identify the evidence you need from each candidate.</li><li>Recommend a next action for each profile and explain any escalation.</li></ol><p class="small">Rubric: requirement accuracy 25%; evidence quality 30%; risk identification 25%; clarity and record keeping 20%.</p><textarea id="assignmentText" placeholder="Write your response...">${esc(state['assignmentText'+key]||'')}</textarea><div class="row"><button class="btn" onclick="submitAssignment(${i},${n})">Save assignment submission</button><button class="btn secondary" onclick="openModule(${i})">Back</button></div><div id="assignMsg"></div></div></div>`}
function submitAssignment(i,n){let v=$('#assignmentText').value.trim();if(v.length<80){alert('Please provide a substantive response (at least 80 characters).');return}state['assignmentText'+i+'-'+n]=v;state.assignments[i+'-'+n]=true;save();$('#assignMsg').innerHTML='<p style="color:var(--green)">Submission saved. Instructor review is simulated in this standalone version; compare your work with the rubric.</p>'}
function startQuiz(i){let qs=DATA.quizzes[i];$('#app').innerHTML=`<div class="content"><div class="eyebrow">MODULE ${i+1} EXAMINATION</div><h1>${esc(DATA.modules[i].title)}</h1><p class="muted">15 scenario-based questions · 80% pass mark · retakes allowed. Choose one best answer for each question.</p><form id="quiz">${qs.map((q,k)=>`<div class="card" style="margin:13px 0"><b>${k+1}. ${esc(q.q)}</b>${q.options.map((o,x)=>`<label class="option"><input type="radio" name="q${k}" value="${x}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn" type="submit">Submit examination</button></form></div>`;$('#quiz').onsubmit=e=>{e.preventDefault();let score=0,review=[];qs.forEach((q,k)=>{let v=document.querySelector('input[name=q'+k+']:checked');if(v&&+v.value===q.answer)score++;review.push({q:k+1,ok:!!v&&+v.value===q.answer,why:q.why})});let percent=Math.round(score/qs.length*100),pass=percent>=80;state.attempts[i]=(state.attempts[i]||0)+1;state.scores[i]=Math.max(state.scores[i]||0,percent);if(pass)state.passed[i]=true;save();$('#app').innerHTML=`<div class="content"><div class="eyebrow">ASSESSMENT RESULT</div><h1>${pass?'Module passed':'Not passed yet'}</h1><div class="card"><div class="stat">${percent}%</div><p>${score} of 15 correct · ${pass?'You met the 80% threshold.':'Review the lessons and retake the assessment.'}</p><div class="progress"><i style="width:${percent}%"></i></div><p class="small">Attempt ${state.attempts[i]} · Best score ${state.scores[i]}%</p></div><h2>Answer review</h2>${review.map(r=>`<div class="card" style="margin:8px 0"><b>${r.ok?'✓':'✕'} Question ${r.q}</b><p class="small">${esc(r.why)}</p></div>`).join('')}<button class="btn" onclick="openModule(${i})">Return to module</button> <button class="btn secondary" onclick="startQuiz(${i})">Retake</button></div>`}}
function glossary(){let q='';$('#app').innerHTML=`<div class="eyebrow">KNOWLEDGE LIBRARY</div><h1>Recruitment glossary</h1><p class="muted">Search ${DATA.glossary.length} recruitment, commercial, technology and compliance terms.</p><div class="field searchbar"><input id="gsearch" placeholder="Search term, definition or category..."></div><div id="gtable"></div>`;$('#gsearch').oninput=renderGloss}
function renderGloss(){let q=$('#gsearch').value.toLowerCase();let a=DATA.glossary.filter(x=>x.join(' ').toLowerCase().includes(q));$('#gtable').innerHTML=`<div class="card"><b>${a.length} terms</b><table><thead><tr><th>Term</th><th>Meaning</th><th>Recruiter use</th><th>Category</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[2])}</td><td>${esc(x[1])}</td><td><span class="pill">${esc(x[3])}</span></td></tr>`).join('')}</tbody></table></div>`}
function tech(){ $('#app').innerHTML=`<div class="eyebrow">KNOWLEDGE LIBRARY</div><h1>IT technology library</h1><p class="muted">A recruiter’s orientation guide. It helps you recognise terminology and ask evidence-based questions; it does not qualify you to conduct a technical interview.</p><div class="field searchbar"><input id="tsearch" placeholder="Search a technology, title or framework..."></div><div id="tlist" class="grid two"></div>`;$('#tsearch').oninput=renderTech;renderTech()}
function renderTech(){let q=$('#tsearch').value.toLowerCase();let a=DATA.tech.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));$('#tlist').innerHTML=a.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.purpose)}</p><p class="small"><b>Related:</b> ${esc(x.related)}</p><p class="small"><b>Job titles:</b> ${esc(x.titles)}</p><div class="callout"><b>Resume evidence to look for</b><br>${esc(x.resume)}</div></div>`).join('')}
function jdLab(){$('#app').innerHTML=`<div class="eyebrow">PRACTICAL LAB</div><h1>JD analysis lab</h1><p class="muted">Extract the role facts before sourcing. Use this fictional practice JD.</p><div class="card"><h3>Senior React / Node.js Engineer</h3><p>Remote contract, 6 months initially. 5+ years of hands-on development. Strong React and Node.js, REST APIs, PostgreSQL. AWS exposure preferred. Must overlap 4 hours with UK business time. Monthly budget ceiling is approved in EUR. Candidate must be available within 30 days.</p><div class="grid two">${['Must-have skills','Preferred skills','Experience / seniority','Employment type / duration','Work mode / time zone','Budget / currency','Target job titles','Clarifications required'].map(x=>`<div class="field"><label>${x}</label><textarea data-jd="${x}" placeholder="Your analysis..."></textarea></div>`).join('')}</div><button class="btn" onclick="gradeJD()">Evaluate analysis</button><div id="jdresult"></div></div>`}
function gradeJD(){let fields=[...document.querySelectorAll('[data-jd]')],filled=fields.filter(x=>x.value.trim().length>12).length;$('#jdresult').innerHTML=`<div class="callout"><b>Completion: ${filled}/8 fields</b><p>${filled>=7?'Good coverage. Review whether every mandatory condition is testable and whether budget details are fully confirmed.':'Your analysis is incomplete. A recruiter should not begin sourcing until key constraints are clear.'}</p><p>Expected anchors: React, Node.js, REST APIs and PostgreSQL are mandatory; AWS is preferred; 5+ hands-on years; 6-month remote contract; UK overlap; EUR monthly budget; availability within 30 days.</p></div>`}
function resumeLab(){$('#app').innerHTML=`<div class="eyebrow">PRACTICAL LAB</div><h1>Resume analysis lab</h1><p class="muted">Evaluate evidence against the fictional JD. Do not infer proficiency from a keyword alone.</p><div class="grid two"><div class="card"><h3>Candidate A — Maya</h3><p>6 years in software development. 4 years React, 3 years Node.js. Built customer portal and internal APIs. PostgreSQL used in two production projects. Current notice: 45 days. Explains ownership clearly.</p><span class="pill">Profile A</span></div><div class="card"><h3>Candidate B — Rahul</h3><p>7 years total IT experience. 5 years manual QA, 1 year React training, no production Node.js project. Immediate availability. Profile headline says Full Stack Engineer.</p><span class="pill">Profile B</span></div></div><div class="card"><h3>Your evaluation</h3><div class="field"><label>Who is the stronger initial match?</label><select id="rchoice"><option value="">Choose...</option><option value="A">Candidate A</option><option value="B">Candidate B</option><option value="neither">Neither</option></select></div><div class="field"><label>Evidence and risks</label><textarea id="rwhy" placeholder="Explain the match and what still needs verification..."></textarea></div><button class="btn" onclick="gradeResume()">Check evaluation</button><div id="rresult"></div></div>`}
function gradeResume(){let c=$('#rchoice').value;$('#rresult').innerHTML=`<div class="callout">${c==='A'?'Correct direction: Candidate A has relevant hands-on evidence in both core technologies and PostgreSQL. Verify project dates, depth, rate, time-zone overlap and availability.': 'Candidate A is the stronger initial match. Candidate B’s overall IT tenure and headline do not establish hands-on React/Node.js delivery.'}</div>`}
function booleanLab(){$('#app').innerHTML=`<div class="eyebrow">PRACTICAL LAB</div><h1>Boolean search builder</h1><p class="muted">Create a layered search string and copy it for adaptation to the platform you use.</p><div class="card"><div class="grid two"><div class="field"><label>Primary job title</label><input id="bt" value="Senior React Developer"></div><div class="field"><label>Alternative titles (comma separated)</label><input id="bta" value="Frontend Engineer, Full Stack Developer"></div><div class="field"><label>Core skills (comma separated)</label><input id="bs" value="React, JavaScript, TypeScript"></div><div class="field"><label>Related skills (comma separated)</label><input id="br" value="Node.js, Next.js"></div><div class="field"><label>Location terms</label><input id="bl" value="India OR Remote"></div><div class="field"><label>Exclude terms (comma separated)</label><input id="be" value="intern, fresher"></div></div><button class="btn" onclick="buildBoolean()">Generate search</button><div class="field"><label>Generated Boolean string</label><textarea id="bout" readonly></textarea></div><button class="btn secondary" onclick="navigator.clipboard?.writeText($('#bout').value)">Copy string</button><div class="callout"><b>Logic:</b> OR broadens within a concept group; AND narrows between required groups; NOT excludes unwanted results. Parentheses keep alternatives together. Test platform syntax and result quality before relying on it.</div></div>`}
function buildBoolean(){let split=id=>$('#'+id).value.split(',').map(x=>x.trim()).filter(Boolean);let quote=a=>a.map(x=>'"'+x+'"').join(' OR ');let title=split('bt').concat(split('bta')),skills=split('bs'),related=split('br'),ex=split('be'),loc=$('#bl').value.trim();$('#bout').value='('+quote(title)+') AND ('+quote(skills)+')'+(related.length?' AND ('+quote(related)+')':'')+(loc?' AND ('+loc+')':'')+(ex.length?' NOT ('+quote(ex)+')':'')}
function sourcingLab(){$('#app').innerHTML=`<div class="eyebrow">PRACTICAL LAB</div><h1>Candidate sourcing lab</h1><div class="card"><h3>Requirement: SAP S/4HANA ABAP Consultant</h3><p>Senior, 8+ years, 12-month contract, remote with CET overlap. Need implementation and production support experience.</p><p><b>Choose the strongest channel mix:</b></p>${['Internal talent pool / Console first, then LinkedIn Recruiter and specialist SAP communities','Only general job boards; use the exact title as a single keyword','Only GitHub because all SAP consultants publish code there','Send a generic message to every profile with SAP in the headline'].map((x,i)=>`<label class="option"><input type="radio" name="source" value="${i}">${x}</label>`).join('')}<button class="btn" onclick="gradeSource()">Check strategy</button><div id="sresult"></div></div>`}
function gradeSource(){let v=document.querySelector('input[name=source]:checked')?.value;$('#sresult').innerHTML=`<div class="callout">${v==='0'?'Correct. Start with the internal pool, use role-relevant specialist channels, and validate implementation vs support experience.':'The strongest option is the targeted mix: check the internal pool first, then LinkedIn Recruiter and specialist SAP communities. Match channels to where the talent is visible.'}</div>`}
function communicationLab(){$('#app').innerHTML=`<div class="eyebrow">PRACTICAL LAB</div><h1>Candidate communication lab</h1><p>Write a concise first-contact message for the fictional role below.</p><div class="card"><b>Role:</b> Senior AWS DevOps Engineer · Remote contract · 12 months · UK overlap. Do not disclose the client name unless authorised. Do not invent a rate.</div><div class="card"><div class="field"><label>Your outreach message</label><textarea id="comm" placeholder="Hi [Name]..."></textarea></div><button class="btn" onclick="gradeComm()">Review message</button><div id="cresult"></div></div>`}
function gradeComm(){let t=$('#comm').value,checks=[['Personalisation',/name|profile|experience/i.test(t)],['Role clarity',/AWS|DevOps/i.test(t)],['Work arrangement',/remote|contract/i.test(t)],['Honest next step',/confirm|discuss|details/i.test(t)],['Professional length',t.length>=80&&t.length<=900]];$('#cresult').innerHTML=`<div class="callout"><b>Writing checklist: ${checks.filter(x=>x[1]).length}/5</b><ul>${checks.map(x=>`<li>${x[1]?'✓':'○'} ${x[0]}</li>`).join('')}</ul>Use a real candidate-specific detail, disclose the contract nature, avoid unapproved client/rate claims and make the next step clear.</div>`}
function simulator(){$('#app').innerHTML=`<div class="eyebrow">END-TO-END PRACTICE</div><h1>Recruitment simulator</h1><p class="muted">A guided case exercise using fictional data. Complete each stage and compare your decision with the RapidBrains quality gates.</p><div class="grid two"><div class="card"><span class="pill">CASE 01</span><h3>React.js Developer</h3><p>Remote 6-month contract · React, Node.js, PostgreSQL · 5+ years · UK overlap.</p><button class="btn" onclick="simCase(0)">Start case</button></div><div class="card"><span class="pill">CASE 02</span><h3>AWS / DevOps Engineer</h3><p>Remote 12-month contract · AWS, Kubernetes, Terraform, CI/CD · 7+ years.</p><button class="btn" onclick="simCase(1)">Start case</button></div><div class="card"><span class="pill">CASE 03</span><h3>SAP S/4HANA Consultant</h3><p>Remote contract · S/4HANA, ABAP, implementation and support · CET overlap.</p><button class="btn" onclick="simCase(2)">Start case</button></div></div>`}
function simCase(n){let roles=['React.js Developer','AWS / DevOps Engineer','SAP S/4HANA Consultant'];let skill=[['React','Node.js','PostgreSQL'],['AWS','Kubernetes','Terraform'],['S/4HANA','ABAP','implementation']][n];$('#app').innerHTML=`<div class="eyebrow">SIMULATOR CASE ${n+1}</div><h1>${roles[n]}</h1><div class="card"><h3>Stage 1 — JD analysis</h3><p>Identify mandatory skills, seniority, work mode, contract duration, location/time-zone, budget and availability. The approved budget and client identity are not supplied in this simulation: mark them for clarification.</p><h3>Candidate evidence</h3><table><tr><th>Candidate</th><th>Evidence</th><th>Risk / gap</th></tr><tr><td>Alex</td><td>${skill.join(', ')}; production project ownership; communication 4/5</td><td>Rate not yet confirmed</td></tr><tr><td>Sam</td><td>Strong ${skill[0]} exposure; limited evidence in remaining skills; communication 3/5</td><td>Needs deeper validation</td></tr><tr><td>Jordan</td><td>Adjacent technology; immediate availability</td><td>Core skill gap; cannot explain last project</td></tr></table><h3>Your decision</h3><div class="field"><label>Recommended candidate(s)</label><select id="simchoice"><option value="">Choose...</option><option value="alex">Alex only, subject to rate and logistics validation</option><option value="all">Submit all three to maximise chances</option><option value="jordan">Jordan because immediate availability is most important</option><option value="none">Reject all without further checks</option></select></div><div class="field"><label>What must be verified before submission?</label><textarea id="simwhy"></textarea></div><button class="btn" onclick="gradeSim(${n})">Evaluate decision</button><div id="simresult"></div></div>`}
function gradeSim(n){let v=$('#simchoice').value;let good=v==='alex';$('#simresult').innerHTML=`<div class="callout"><b>${good?'Strong initial recommendation':'Review the quality gates'}</b><p>Alex is the strongest initial match based on the supplied evidence, but is not automatically submission-ready. Confirm exact hands-on experience, rate and currency against the Console, availability, time-zone overlap, candidate consent, communication score and all high-weight criteria. RapidBrains SOP: submit a maximum of 2–3 curated profiles; communication must be at least 3/5; attach the completed pre-submission scorecard; escalate unresolved issues.</p></div>`}

function competitorLab(){$('#app').innerHTML=`<div class="eyebrow">PRACTICAL LAB</div><h1>Competitor research lab</h1><p class="muted">All figures below are simulated training data, not verified market statistics.</p><div class="card"><h3>Scenario: Cloud engineering talent in Bengaluru</h3><table><tr><th>Employer group</th><th>Open roles observed</th><th>Likely skills</th><th>Sample median monthly expectation</th></tr><tr><td>Cloud service firms</td><td>18</td><td>AWS, Linux, Terraform</td><td>₹1.8 lakh</td></tr><tr><td>Product companies</td><td>12</td><td>Kubernetes, Go, SRE</td><td>₹2.4 lakh</td></tr><tr><td>IT services</td><td>26</td><td>Azure, DevOps, CI/CD</td><td>₹1.5 lakh</td></tr></table><div class="field"><label>What limitations should be stated in your report?</label><textarea id="cr1" placeholder="Consider sample size, date, source, role level, geography and currency..."></textarea></div><div class="field"><label>What sourcing strategy would you recommend?</label><textarea id="cr2" placeholder="Describe target employers, channels and search themes..."></textarea></div><button class="btn" onclick="gradeCompetitor()">Evaluate report</button><div id="crresult"></div></div>`}
function gradeCompetitor(){let a=$('#cr1').value.toLowerCase(),b=$('#cr2').value.toLowerCase();let terms=['sample','date','source','simulated'];let n=terms.filter(t=>a.includes(t)).length;$('#crresult').innerHTML=`<div class="callout"><b>Research quality check: ${n}/4 evidence limitations mentioned.</b><p>State clearly that the table is simulated. A responsible report should define sample size, collection date, geography, seniority, data source and whether expectations are salary or contractor rates. Do not generalise the figures to the whole market. Build a channel mix from internal records, LinkedIn, relevant communities and referrals, then validate actual candidate expectations directly.</p></div>`}
function finalExam(){$('#app').innerHTML=`<div class="eyebrow">FINAL CERTIFICATION</div><h1>Final certification examination</h1><p class="muted">30 applied questions across recruitment fundamentals, JD analysis, Boolean search, resume selection, outreach/screening, SOP and ethics. Pass mark: 85%. A critical compliance error blocks certification.</p><form id="finalquiz">${Array.from({length:30},(_,i)=>{let areas=['Recruitment fundamentals','JD analysis','Boolean search','Resume and candidate selection','Outreach and screening','RapidBrains SOP and ethics'];let scenarios=[
'The client has not clarified whether AWS is mandatory or preferred. What should happen before sourcing?',
'A candidate has a strong headline but cannot explain the project listed on the resume. What is the correct action?',
'A recruiter is asked to quote a rate but the currency is not visible in the Console. What should happen?',
'A candidate has communication rated 2/5 but is technically strong. Can the profile be submitted?',
'The client changes a must-have skill after sourcing begins. What should the recruiter do?',
'A candidate has not consented to sharing personal information with the client. What is the correct next step?'
];let correct=['Clarify and document the requirement before sourcing.','Pause progression and investigate the inconsistency; do not submit unsupported claims.','Verify the approved rate, currency and unit with the authorised owner.','No. The RapidBrains SOP requires at least 3/5 communication.','Stop, reanalyse the JD and requalify candidates against the changed requirement.','Do not share the information; obtain clear consent under policy.'][i%6];let wrong=['Assume the most common interpretation and start immediately.','Ignore the issue because the candidate has relevant keywords.','Use the rate from a previous job as a guide.','Submit and let the client decide.'];let opts=[correct,...wrong];let shift=(i*3)%4;let answer=(4-shift)%4;opts=opts.slice(shift).concat(opts.slice(0,shift));return `<div class="card" data-answer="${answer}" style="margin:12px 0"><b>${i+1}. ${areas[Math.floor(i/5)]} — ${scenarios[i%6]}</b>${opts.map((o,j)=>`<label class="option"><input type="radio" name="f${i}" value="${j}">${o}</label>`).join('')}</div>`}).join('')}<div class="card"><label class="option"><input type="checkbox" id="critical"> I confirm I would never knowingly submit a profile with unresolved critical compliance, consent or high-weight quality-gate failures.</label><button class="btn" type="submit">Submit final examination</button></div></form>`;$('#finalquiz').onsubmit=e=>{e.preventDefault();let score=0;for(let i=0;i<30;i++){let v=document.querySelector('input[name=f'+i+']:checked');if(v&&+v.value===+document.querySelectorAll('#finalquiz .card[data-answer]')[i].dataset.answer)score++}let pass=score/30>=.85&&$('#critical').checked;state.finalScore=Math.round(score/30*100);state.finalPassed=pass;save();$('#app').innerHTML=`<div class="content"><div class="eyebrow">FINAL EXAM RESULT</div><h1>${pass?'Final exam passed':'Further study required'}</h1><div class="card"><div class="stat">${state.finalScore}%</div><p>${score}/30 correct. Required: 85% and critical compliance acknowledgement.</p><p>${pass?'You have met the exam threshold. Full certification eligibility still depends on all modules, assignments, practical work and instructor verification.':'Review the relevant modules and retake the examination.'}</p><button class="btn" onclick="finalExam()">Retake final exam</button></div></div>`}}
function assignments(){$('#app').innerHTML=`<div class="eyebrow">WORK SAMPLES</div><h1>Assignments</h1><p class="muted">Module assignments are stored in this browser. Each module contains three work-sample tasks.</p><div class="grid two">${DATA.modules.map((m,i)=>`<div class="card"><b>Module ${i+1}: ${esc(m.title)}</b><p class="small">${[1,2,3].filter(n=>state.assignments[i+'-'+n]).length}/3 submitted</p><button class="btn secondary" onclick="openModule(${i})">Open assignments</button></div>`).join('')}</div>`}
function performance(){$('#app').innerHTML=`<div class="eyebrow">LEARNER REPORT</div><h1>My performance</h1><div class="grid"><div class="card"><div class="small">Lessons complete</div><div class="stat">${Object.values(state.done).filter(Boolean).length}</div></div><div class="card"><div class="small">Module exams passed</div><div class="stat">${Object.values(state.passed).filter(Boolean).length}</div></div><div class="card"><div class="small">Assignments submitted</div><div class="stat">${Object.values(state.assignments).filter(Boolean).length}</div></div></div><div class="card" style="margin-top:16px"><h3>Module assessment history</h3><table><tr><th>Module</th><th>Attempts</th><th>Best score</th><th>Status</th></tr>${DATA.modules.map((m,i)=>`<tr><td>${i+1}. ${esc(m.title)}</td><td>${state.attempts[i]||0}</td><td>${state.scores[i]||'—'}${state.scores[i]?'%':''}</td><td>${state.passed[i]?'Passed':'Pending'}</td></tr>`).join('')}</table><div class="row" style="margin-top:14px"><button class="btn" onclick="exportCSV()">Export results CSV</button><button class="btn secondary" onclick="window.print()">Print report</button></div></div><div class="callout"><b>Storage limitation:</b> This standalone demo stores data in localStorage on this browser only. It does not provide centralised accounts, instructor access across devices or secure multi-user reporting.</div>`}
function exportCSV(){let rows=[['Module','Attempts','Best Score','Passed','Lessons Complete'],...DATA.modules.map((m,i)=>[m.title,state.attempts[i]||0,state.scores[i]||'',state.passed[i]?'Yes':'No',m.lessons.filter((l,j)=>state.done[i+'-'+j]).length])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rapidbrains-trainee-results.csv';a.click();URL.revokeObjectURL(a.href)}
function certificate(){$('#app').innerHTML=`<div class="eyebrow">CERTIFICATION</div><h1>RapidBrains Certified Talent Acquisition Associate</h1><p class="muted">Certificate eligibility is intentionally gated. Complete the learning path, assignments and examinations before issuing a certificate.</p><div class="card"><div class="grid two"><div><div class="field"><label>Trainee name</label><input id="trainee" placeholder="Enter full name"></div><div class="field"><label>Trainee ID</label><input id="traineeid" placeholder="Enter trainee ID"></div></div><div><div class="stat">${pct()}%</div><p>Lesson completion</p><p>${Object.values(state.passed).filter(Boolean).length}/16 module exams passed</p><p>${Object.values(state.assignments).filter(Boolean).length}/48 assignments submitted</p></div></div><div class="callout">Certification requires all 16 modules completed, all 16 exams passed, all mandatory assignments submitted, required practical labs passed, simulator passed and no unresolved critical compliance failure. This standalone demonstration does not yet record instructor verification or a centrally issued certificate.</div><button class="btn" onclick="issueCert()">Check eligibility / print certificate</button><div id="certresult"></div></div>`}
function issueCert(){let name=$('#trainee').value.trim(),id=$('#traineeid').value.trim(),lessons=Object.values(state.done).filter(Boolean).length,passed=Object.values(state.passed).filter(Boolean).length,assign=Object.values(state.assignments).filter(Boolean).length;let total=DATA.modules.reduce((a,m)=>a+m.lessons.length,0);if(!name||!id){alert('Enter trainee name and ID.');return}if(lessons<total||passed<16||assign<48){$('#certresult').innerHTML=`<p style="color:var(--red)">Not eligible yet. Lessons ${lessons}/${total}; exams ${passed}/16; assignments ${assign}/48. Simulator and instructor sign-off are also required.</p>`;return}$('#certresult').innerHTML=`<div class="card" id="certprint" style="text-align:center;border:5px double var(--pink);padding:35px;margin-top:18px"><div class="eyebrow">RAPIDBRAINS</div><h1>Certificate of Achievement</h1><p>This certifies that</p><h2>${esc(name)}</h2><p>has completed the learning requirements for</p><h2>RapidBrains Certified Talent Acquisition Associate</h2><p>Trainee ID: ${esc(id)} · Date: ${new Date().toLocaleDateString()}</p><p>Learning completion and assessment records are stored locally in this browser.</p><button class="btn no-print" onclick="window.print()">Print certificate</button></div>`}
dashboard();
</script></body></html>
